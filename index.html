<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
      <form>
        <h1>Login</h1>
      
        <div>
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </div>
      
        <div>
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
      
        <div>
          <input
            id="remember"
            name="remember"
            type="checkbox"
          />
      
          <label for="remember">
            Remember Me
          </label>
        </div>
      
        <button type="submit">
          Login
        </button>
      
        <a href="/forgot-password">
          Forgot Password?
        </a>
      </form>
  </body>
</html>
